version: 1
frontend:
  phases:
    preBuild:
      commands:
        # hub-next (Next.js) is the site now — see the build phase below. The old root
        # node_modules (react-native/expo, for the RN hub's `expo export --platform web`) and that
        # export step are no longer part of this build; only hub-next's own deps are installed.
        - cd hub-next && npm install --no-audit --no-fund && cd ..
    build:
      commands:
        # hub-next's own env — reuses the SAME Amplify Console variables the old Expo build already
        # read (EXPO_PUBLIC_AUTH_API_URL / EXPO_PUBLIC_ACCESS_API_URL), just written under the
        # NEXT_PUBLIC_ prefix Next.js requires for a client-readable build-time env var. No new
        # Amplify Console variables needed. `next build` loads hub-next/.env.production
        # automatically in production mode.
        - echo "NEXT_PUBLIC_AUTH_API_URL=$EXPO_PUBLIC_AUTH_API_URL" > hub-next/.env.production
        - echo "NEXT_PUBLIC_ACCESS_API_URL=$EXPO_PUBLIC_ACCESS_API_URL" >> hub-next/.env.production
        - echo "NEXT_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > embedded-apps/expense/.env
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > embedded-apps/rc-portal/.env
        - echo "REACT_APP_API_URL=$REACT_APP_API_URL" > embedded-apps/audit-capa/.env
        - cd hub-next && npm run build && cd ..
        # hub-next's static export (hub-next/out/) becomes the site root. It already includes its
        # own lightweight redirect/iframe stub for every embedded app's URL (see
        # hub-next/src/app/apps/[appId]/page.tsx) — build:embedded below overwrites those stubs
        # with each app's real build output at the exact same dist/apps/<name>/ path, same as it
        # always has; this copy has to run BEFORE build:embedded so that overwrite actually happens.
        - mkdir -p dist && cp -R hub-next/out/. dist/
        - npm run build:embedded
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      # hub-next's own deps + Next's incremental build cache — the root RN/Expo node_modules this
      # used to cache no longer exists in this build (see preBuild above).
      - hub-next/node_modules/**/*
      - hub-next/.next/cache/**/*
      # The embedded apps' node_modules are NOT cached directly — combined they exceeded Amplify's
      # 5GB per-cache-artifact hard limit on the real Linux build container (confirmed via the
      # actual build log: "Unable to write cache: File size must be less than 5GB"), so the cache
      # write silently failed on every single build and each deploy was getting zero benefit from
      # it. build-embedded-apps.js points every embedded app's `npm install` at this ONE shared,
      # deduped npm tarball cache instead (see NPM_CACHE_DIR) — same effective packages, a fraction
      # of the size, comfortably under the limit.
      - .npm-cache/**/*
      # Each embedded app's own build OUTPUT (not its node_modules) — tiny (a few MB to ~10MB
      # each, ~100MB combined for all 9, nowhere near the 5GB limit). build-embedded-apps.js
      # skips an app's install+build entirely when nothing under its own directory changed since
      # this cached dist/ was produced (tracked via a marker file inside it), which is the actual
      # dominant remaining build-time cost — most deploys only touch 1-2 of these 9 apps.
      - embedded-apps/*/dist/**/*
