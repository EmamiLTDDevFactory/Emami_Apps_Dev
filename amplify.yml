version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm install (not ci) so the cached root node_modules/ below actually gets reused —
        # npm ci always wipes and reinstalls from scratch regardless of what's on disk, same
        # reasoning build-embedded-apps.js already documents for the embedded apps' installs.
        - npm install
    build:
      commands:
        - echo "EXPO_PUBLIC_AUTH_API_URL=$EXPO_PUBLIC_AUTH_API_URL" > .env
        - echo "EXPO_PUBLIC_ACCESS_API_URL=$EXPO_PUBLIC_ACCESS_API_URL" >> .env
        - echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > embedded-apps/non-ctc-expense/.env
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > embedded-apps/rc-portal/.env
        - echo "REACT_APP_API_URL=$REACT_APP_API_URL" > embedded-apps/audit-capa/.env
        - npm run build:web
        - npm run build:embedded
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      # build-embedded-apps.js runs `npm install` (not `npm ci`) per embedded app, which reuses
      # whatever's already on disk and only fetches what changed — but only if that node_modules
      # survives between builds. Previously nothing under embedded-apps/ was cached, so every
      # single deploy reinstalled all 9 embedded apps' dependencies from scratch (~3-4 min each).
      - embedded-apps/*/node_modules/**/*
