version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm install (not ci) so the cached root node_modules/ below actually gets reused —
        # npm ci always wipes and reinstalls from scratch regardless of what's on disk, same
        # reasoning build-embedded-apps.js already documents for the embedded apps' installs.
        - npm install
    build:
      commands:
        - echo "EXPO_PUBLIC_AUTH_API_URL=$EXPO_PUBLIC_AUTH_API_URL" > .env
        - echo "EXPO_PUBLIC_ACCESS_API_URL=$EXPO_PUBLIC_ACCESS_API_URL" >> .env
        - echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" > embedded-apps/non-ctc-expense/.env
        - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > embedded-apps/rc-portal/.env
        - echo "REACT_APP_API_URL=$REACT_APP_API_URL" > embedded-apps/audit-capa/.env
        - npm run build:web
        - npm run build:embedded
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      # Root's own node_modules — small enough (~500MB) to cache directly; npm install already
      # skips reinstalling anything when this matches the lockfile (confirmed: 20s, not minutes).
      - node_modules/**/*
      # The 9 embedded apps' node_modules are NOT cached directly (that was previously here) —
      # combined they exceeded Amplify's 5GB per-cache-artifact hard limit on the real Linux build
      # container (confirmed via the actual build log: "Unable to write cache: File size must be
      # less than 5GB"), so the cache write silently failed on every single build and each deploy
      # was getting zero benefit from it. build-embedded-apps.js now points every embedded app's
      # `npm install` at this ONE shared, deduped npm tarball cache instead (see NPM_CACHE_DIR) —
      # same effective packages, a fraction of the size, comfortably under the limit.
      - .npm-cache/**/*
