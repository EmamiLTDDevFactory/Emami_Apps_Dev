# sap-agent.emamiapps.in -> SAP Agent web API on 172.17.2.21 (PM2 sap-agent-dev :4130, later sap-agent :4131).
# Prerequisite: DNS A record sap-agent.emamiapps.in -> the same public IP as audit-capa-api.emamiapps.in.
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled (never copy, never keep .bak
# files in sites-enabled), `sudo nginx -t && sudo systemctl reload nginx`, then
# `sudo certbot --nginx -d sap-agent.emamiapps.in` adds the TLS server block.
server {
    listen 80;
    server_name sap-agent.emamiapps.in;

    # DEV engine (the UI on dev.emamiapps.in calls https://sap-agent.emamiapps.in/dev/...)
    location /dev/ {
        proxy_pass http://127.0.0.1:4130/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Live run events are server-sent events; agent runs take minutes.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # PROD engine (not deployed yet)
    # location / { proxy_pass http://127.0.0.1:4131/; ...same settings... }
}
