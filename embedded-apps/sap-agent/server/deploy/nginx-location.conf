# SAP Agent on the EXISTING audit-capa-api.emamiapps.in site (172.17.2.21), next to Rate Auction.
# Lives in /etc/nginx/sites-available/audit-capa-api.emamiapps.in.conf (sites-enabled holds a symlink:
# edit the sites-available file, keep backups in sites-available, `sudo nginx -t` before reload).
# Installed 2026-10-06 for DEV; PROD would be `location /api/sap-agent/` -> 127.0.0.1:4131.

    # SAP Agent (dev) — embedded-apps/sap-agent/server (FastAPI + the sap-agent engine), PM2
    # "sap-agent-dev", port 4130. Strip-prefix like Rate Auction. Live run events are server-sent
    # events and agent runs take minutes, so buffering is off and the read timeout is long.
    location /dev-api/sap-agent/ {
        proxy_pass http://127.0.0.1:4130/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        client_max_body_size 2m;
    }
