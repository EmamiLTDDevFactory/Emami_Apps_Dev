# Installs the agent's own SAP-side handler through ADT. After this, only the ICF node is manual (once per system).
project: sap_agent_bootstrap
package:
  name: ZEMAMI
  description: Emami development (SAP agent)
  software_component: HOME
  transport_layer: ""
steps:
  - {id: pkg, type: package}
  - {id: tr, type: transport, description: "SAP agent bootstrap"}
  - id: src
    type: sources
    base: .
    files:
      - {kind: class, name: ZCL_SRC_AGENT_TASKS, file: zcl_src_agent_tasks.clas.abap, description: "SAP agent task runner"}
      - {kind: class, name: ZCL_SRC_AGENT_HTTP, file: zcl_src_agent_http.clas.abap, description: "SAP agent ICF handler"}
  - {id: act, type: activate, group: src}
  - id: icf
    type: note
    text: "Manual, once: SICF, create /sap/zsrc_agent/tasks with handler ZCL_SRC_AGENT_HTTP. PFCG: the agent role (default Z_SRC_AGENT). STVARV: select-option ZSRC_AGENT_SIDS = this system id, select-option ZSRC_AGENT_PACKAGES = the package(s) the agent may work in (ZEMAMI)."
