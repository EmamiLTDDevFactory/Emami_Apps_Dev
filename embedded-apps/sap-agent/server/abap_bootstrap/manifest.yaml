# Installs the agent's own SAP-side handler through ADT. After this, only STVARV and the role are manual (once per system).
project: sap_agent_bootstrap
package:
  name: ZEMAMI
  description: Emami development (SAP agent)
  software_component: HOME
  transport_layer: ""
steps:
  - {id: pkg, type: package}
  - {id: tr, type: transport, description: "SAP agent bootstrap"}
  - id: src
    type: sources
    base: .
    files:
      - {kind: class, name: ZCL_SRC_AGENT_TASKS, file: zcl_src_agent_tasks.clas.abap, description: "SAP agent task runner"}
      - {kind: class, name: ZCL_SRC_AGENT_HTTP, file: zcl_src_agent_http.clas.abap, description: "SAP agent ICF handler"}
      - {kind: class, name: ZCL_SRC_AGENT_RUN, file: zcl_src_agent_run.clas.abap, description: "SAP agent runner (no SICF)"}
  - {id: act, type: activate, group: src}
  - id: icf
    type: note
    text: "Manual, once: PFCG, the agent role (default Z_SRC_AGENT) for the SAP users who run the agent. STVARV: select-option ZSRC_AGENT_SIDS = this system id, select-option ZSRC_AGENT_PACKAGES = the package(s) the agent may work in (ZEMAMI). No SICF node is needed: the agent reaches the handler through ADT (ZCL_SRC_AGENT_RUN). Only with SAP_HANDLER_MODE=http: SICF /sap/zsrc_agent/tasks with handler ZCL_SRC_AGENT_HTTP."
