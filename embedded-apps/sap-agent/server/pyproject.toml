[project]
name = "sap-agent"
version = "0.1.0"
description = "AI agent that builds SAP ABAP projects end to end through ADT and a SAP-side task handler"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sap-agent = "sap_agent.cli:main"

[tool.setuptools.packages.find]
include = ["sap_agent*"]
