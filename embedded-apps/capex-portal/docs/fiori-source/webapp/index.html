<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#12233A">
    <title>CAPEX Approval Portal</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
        body { margin: 0; }
    </style>
    <!-- SheetJS (vendored, not loaded from a CDN - this runs on an internal
         corporate network with no guaranteed outbound internet access, and
         the version published on the public npm registry has two known
         unpatched vulnerabilities, so this is fetched straight from
         SheetJS's own fixed release instead - see Budget Create's Excel
         import feature). -->
    <script src="./thirdparty/xlsx.mini.min.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "zcapexportal": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-preload="async"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="zcapexportal"
        data-id="container"
        data-settings='{"id" : "zcapexportal"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
