<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Master Data — Development Tracker</title>
  <link rel="stylesheet" href="/apps/dev-tracker/style.css" />
  <style>
    .admin-panel{margin:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;}

    .category-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
    .category-pill{
      display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;
      border:1px solid var(--line);background:var(--surface);color:var(--muted);
      font-size:12.5px;font-weight:600;cursor:pointer;transition:.13s ease;
    }
    .category-pill:hover{border-color:#c7d6e6;color:var(--ink);}
    .category-pill.active{background:var(--navy);border-color:var(--navy);color:#fff;}
    .category-pill .cp-swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

    .md-caption{
      font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
      margin-bottom:12px;
    }

    .md-row{
      display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;margin-bottom:5px;
      background:var(--row-bg, var(--bg));border-left:3px solid var(--row-accent, var(--line));
      transition:background .13s ease;
    }
    .md-row:hover{background:var(--row-bg-hover, #eef0f3);}
    .md-row.inactive{opacity:.55;}
    .md-row.inactive .md-value{color:var(--muted);text-decoration:line-through;text-decoration-color:#c7ccd6;}
    .md-value{flex:1;font-size:13.5px;font-weight:500;color:var(--ink);}
    .md-value .swatch-dot{
      position:relative;width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:9px;vertical-align:-1px;
      box-shadow:0 0 0 3px rgba(255,255,255,.6);overflow:hidden;
    }
    .md-value .swatch-input{
      position:absolute;inset:-4px;opacity:0;cursor:pointer;border:none;padding:0;margin:0;
    }
    .md-value-text{cursor:default;}
    .md-row-actions{display:flex;align-items:center;gap:12px;margin-left:auto;}
    .link-btn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;transition:color .12s ease;}
    .link-btn:hover{color:var(--accent);}

    .switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0;}
    .switch input{opacity:0;width:0;height:0;}
    .switch-track{position:absolute;inset:0;background:#d5d9e0;border-radius:20px;cursor:pointer;transition:background .15s ease;}
    .switch-track:before{
      content:"";position:absolute;width:15px;height:15px;left:2.5px;top:2.5px;background:#fff;border-radius:50%;
      transition:transform .15s ease;box-shadow:0 1px 3px rgba(0,0,0,.2);
    }
    .switch input:checked + .switch-track{background:var(--green);}
    .switch input:checked + .switch-track:before{transform:translateX(16px);}

    .add-row{
      display:flex;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
      flex-wrap:wrap;align-items:center;
    }
    .add-row input[type=text]{flex:1;min-width:160px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;transition:border-color .13s ease, box-shadow .13s ease;}
    .add-row input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,124,177,.15);}
    .add-row input[type=color]{width:36px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;cursor:pointer;}
    .add-row button{
      padding:9px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;
      font-size:13px;font-weight:600;cursor:pointer;transition:background .13s ease;
    }
    .add-row button:hover{background:#356c9c;}

    .inline-error{color:var(--red);font-size:12px;margin-top:10px;display:none;}
  </style>
</head>
<body>
  <div id="app">
    <div class="account-strip" id="accountStrip">
      <div class="account-bar" id="accountBar"></div>
    </div>
    <div class="topbar">
      <div class="topbar-head">
        <div class="topbar-title">
          <a class="back-link" href="/apps/dev-tracker">&larr; Home</a>
          <span class="eyebrow">SAP Change &amp; Development Log</span>
          <h1>Manage Master Data</h1>
        </div>
      </div>
    </div>

    <div class="admin-panel" id="masterdataPanel">
      <div class="category-picker" id="categoryPicker"></div>
      <div class="md-caption" id="mdCaption"></div>
      <div id="mdList"></div>
      <div class="add-row" id="addForm"></div>
      <div class="inline-error" id="mdError"></div>
    </div>
  </div>

  <script src="/apps/dev-tracker/admin.js"></script>
</body>
</html>
